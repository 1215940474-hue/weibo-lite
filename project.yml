name: WeiboLite
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  WeiboLite:
    type: application
    platform: iOS
    sources:
      - path: WeiboLite
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 微博轻读
        CFBundleShortVersionString: "0.9.4"
        CFBundleVersion: "16"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: 保存图片到相册
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.weibolite
        PRODUCT_NAME: WeiboLite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  WeiboLiteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WeiboLiteUITests
    dependencies:
      - target: WeiboLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.weibolite.uitests
        TEST_TARGET_NAME: WeiboLite
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WeiboLite:
    build:
      targets:
        WeiboLite: all
        WeiboLiteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WeiboLiteUITests
    archive:
      config: Release
