name: Build unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WeiboLite (unsigned IPA)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Archive (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project WeiboLite.xcodeproj \
            -scheme WeiboLite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/WeiboLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            STRIP_INSTALLED_PRODUCT=NO \
            COPY_PHASE_STRIP=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            archive

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find build/WeiboLite.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP"
          rm -rf build/Payload build/out
          mkdir -p build/Payload build/out
          cp -R "$APP" build/Payload/
          cd build
          zip -qry out/WeiboLite-unsigned.ipa Payload
          cd ..
          ls -lh build/out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeiboLite-unsigned-ipa
          path: build/out/WeiboLite-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone (1[5-9]|2[0-9])" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"
          xcrun simctl boot "$UDID" || true

      - name: Run UI screenshot tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project WeiboLite.xcodeproj \
            -scheme WeiboLite \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/WeiboLite.xcresult \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Export screenshots
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/WeiboLite.xcresult --output-path build/screenshots || true
          python3 - <<'PY'
          import json, os, shutil
          base = "build/screenshots"
          manifest = os.path.join(base, "manifest.json")
          if not os.path.exists(manifest):
              print("no manifest")
              raise SystemExit(0)
          with open(manifest) as f:
              data = json.load(f)
          for test in data.get("attachments", data if isinstance(data, list) else []):
              for att in test.get("attachments", []) if isinstance(test, dict) else []:
                  src = os.path.join(base, att.get("exportedFileName", ""))
                  name = att.get("suggestedHumanReadableName", "").strip() or "shot"
                  if os.path.exists(src):
                      dst = os.path.join(base, name + ".png")
                      shutil.move(src, dst)
                      print("exported", dst)
          PY
          ls -la build/screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/screenshots
          if-no-files-found: warn
          retention-days: 14
